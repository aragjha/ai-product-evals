name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no network, no key)
        run: python -m unittest discover -s tests -v
      - name: Dataset unchanged
        run: python -m pevals check-data
      - name: Fixture eval reproduces saved results
        run: python -m pevals demo --out out/ci --check
